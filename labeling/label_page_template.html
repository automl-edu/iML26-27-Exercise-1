<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Label tree interpretability</title>
<style>
 body { font-family: system-ui, sans-serif; margin: 0; color: #2b2b28; background: #fafaf8; }
 header { position: sticky; top: 0; background: #fafaf8; border-bottom: 1px solid #e3e2dc; padding: 12px 20px; }
 h1 { font-size: 16px; margin: 0 0 4px; }
 .q { font-size: 14px; margin: 6px 0; }
 .meta { font-size: 13px; color: #6b6a63; }
 .bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
 button { font-size: 14px; padding: 7px 14px; border-radius: 6px; border: 1px solid #c8c7bf; background: white; cursor: pointer; }
 button.yes { border-color: #1baf7a; } button.no { border-color: #e34948; }
 button.picked { font-weight: 700; } button.yes.picked { background: #dff5ea; } button.no.picked { background: #fde6e6; }
 #view { padding: 16px 20px; overflow: auto; }
 #view img { display: block; background: white; border: 1px solid #e3e2dc; }
 #view.fit img { max-width: 100%; }
 .done { padding: 20px; font-size: 15px; }
 textarea { width: 100%; height: 160px; font-family: monospace; }
</style></head><body>
<header>
 <h1>Interpretability labeling <span class="meta" id="progress"></span></h1>
 <div class="q">__QUESTION__</div>
 <div class="meta">Keys: <b>Y</b> yes · <b>N</b> no · <b>←/→</b> previous/next · <b>Z</b> zoom. Labels are saved in this browser as you go.</div>
 <div class="bar">
  <button class="yes" id="yes">Yes, interpretable (Y)</button>
  <button class="no" id="no">No (N)</button>
  <button id="prev">← Back</button><button id="next">Skip →</button>
  <button id="zoom">Zoom (Z)</button><button id="download">Download labels.csv</button>
  <span class="meta" id="dataset"></span>
 </div>
</header>
<div id="view" class="fit"></div>
<script>
const ITEMS = __ITEMS__;
const KEY = "iml-labels-" + ITEMS.map(it => it.id + it.img.length).join("");  // new set of items = fresh labels
let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { labels = {}; }
let i = ITEMS.findIndex(it => !(it.id in labels)); if (i < 0) i = ITEMS.length;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} };
const csv = () => "item_id,interpretable\n" + ITEMS.filter(it => it.id in labels).map(it => it.id + "," + labels[it.id]).join("\n") + "\n";
function show() {
  const n = Object.keys(labels).length;
  document.getElementById("progress").textContent = `· ${n} / ${ITEMS.length} labeled`;
  const view = document.getElementById("view");
  if (i >= ITEMS.length) {
    view.innerHTML = `<div class="done"><p><b>Done: ${n} of ${ITEMS.length} labeled.</b> Download the labels and save them as <code>labeling/labels.csv</code>.</p><textarea readonly>${csv()}</textarea></div>`;
    document.getElementById("dataset").textContent = ""; mark(); return;
  }
  const it = ITEMS[i];
  view.innerHTML = `<img src="${it.img}" alt="model ${it.id}">`;
  document.getElementById("dataset").textContent = `${it.id} · dataset: ${it.dataset}`;
  mark();
}
function mark() {
  const v = i < ITEMS.length ? labels[ITEMS[i].id] : undefined;
  document.getElementById("yes").classList.toggle("picked", v === 1);
  document.getElementById("no").classList.toggle("picked", v === 0);
}
function answer(v) { if (i >= ITEMS.length) return; labels[ITEMS[i].id] = v; save(); i += 1; show(); window.scrollTo(0, 0); }
function move(d) { i = Math.min(Math.max(i + d, 0), ITEMS.length); show(); }
function download() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv()], { type: "text/csv" })); a.download = "labels.csv"; a.click();
}
document.getElementById("yes").onclick = () => answer(1);
document.getElementById("no").onclick = () => answer(0);
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
document.getElementById("zoom").onclick = () => document.getElementById("view").classList.toggle("fit");
document.getElementById("download").onclick = download;
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "y") answer(1); else if (k === "n") answer(0);
  else if (e.key === "ArrowLeft") move(-1); else if (e.key === "ArrowRight") move(1);
  else if (k === "z") document.getElementById("view").classList.toggle("fit");
});
show();
</script></body></html>
